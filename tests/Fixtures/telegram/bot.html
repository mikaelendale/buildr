<!doctype html>
<!-- Made-up page in the markup of t.me/<bot> (no real bot content). -->
<html>
    <head>
        <meta charset="utf-8" />
        <title>Telegram: Launch @ExampleHelperBot</title>
    </head>
    <body>
        <div class="tgme_page_wrap">
            <div class="tgme_body_wrap">
                <div class="tgme_page">
                    <div class="tgme_page_photo">
                        <a href="tg://resolve?domain=ExampleHelperBot"
                            ><img
                                class="tgme_page_photo_image"
                                src="https://cdn1.telesco.pe/file/example-bot-avatar.jpg"
                        /></a>
                    </div>
                    <div class="tgme_page_title">
                        <span dir="auto">Example Helper</span>
                    </div>
                    <div class="tgme_page_extra">@ExampleHelperBot</div>
                    <div class="tgme_page_extra">12 400 monthly users</div>
                    <div class="tgme_page_description">
                        A made-up bot that answers questions about your account.
                    </div>
                    <div class="tgme_page_action">
                        <a
                            class="tgme_action_button_new shine"
                            href="tg://resolve?domain=ExampleHelperBot"
                            >Start Bot</a
                        >
                    </div>
                    <div class="tgme_page_additional">
                        If you have <strong>Telegram</strong>, you can launch
                        <br /><strong>Example Helper</strong> right away.
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
